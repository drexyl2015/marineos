services:
  - type: web
    name: marineos-api
    runtime: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn main:app --host 0.0.0.0 --port $PORT"
    rootDir: backend
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: CLAUDE_API_KEY
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: '["https://marineos.app","https://www.marineos.app","https://marineos-wine.vercel.app","http://localhost:5173"]'
      - key: DEBUG
        value: "false"
      - key: RELOAD
        value: "false"
      - key: LOG_LEVEL
        value: "INFO"
      - key: PYTHON_VERSION
        value: "3.11.0"
      # MarineOS is free and self-service: signup is open, gated by email
      # verification. Keep this aligned with the backend default (True).
      - key: ALLOW_PUBLIC_REGISTRATION
        value: "true"
