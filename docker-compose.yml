version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: marine-postgres
    environment:
      POSTGRES_USER: marine_user
      POSTGRES_PASSWORD: marine_password
      POSTGRES_DB: marine
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marine_user -d marine"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:

networks:
  default:
    name: marine-network
